name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare-assets
      - run: npm run check
      - run: npm test
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      # Local endpoint policy blocks rustfmt; collect CI formatting for review.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v6
        with:
          name: Rust-formatted-source
          path: |
            src-tauri/src/*.rs
            src-tauri/build.rs
          retention-days: 3
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run build:win
      - uses: actions/upload-artifact@v6
        with:
          name: NIKO-Editor-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: NIKO-Editor-Windows
          path: artifacts
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.exe artifacts/SHA256SUMS.txt --generate-notes --title "NIKO Editor $RELEASE_TAG"
